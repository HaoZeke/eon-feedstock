context:
  version: "2.15.0"

package:
  name: eon
  version: ${{ version }}

# Zero eOn-side patches: upstream eOn (next tag after #363) prefers pkg-config
# readcon-core and uses the >=0.13 builder API. Zero readcon tar/zip sources
# in this feedstock: depend on libreadcon-core from conda-forge. Zero rgpot
# patches: use OmniPotentRPC/rgpot >=1.2.0 which ships capnp .cpp rename.
source:
  - url: https://github.com/TheochemUI/eOn/releases/download/v${{ version }}/eon-v${{ version }}.tar.xz
    # Update sha256 when the next release asset is published (placeholder for 2.15.0 until retag).
    sha256: d4695f81ffd7a1c729f48b5c42737d381c686c79ca63ca95769f31415a3798b7
  - url: https://github.com/OmniPotentRPC/rgpot/archive/refs/tags/v1.2.0.tar.gz
    sha256: 9a4cd4b204029764a568fc92e3d2b0d025db216d595df5e5655eb1e358f953bb
    target_directory: subprojects/rgpot

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - cmake
    - ninja
    - meson
    - pkg-config
    - sccache
    - if: (build_platform != target_platform)
      then:
        - python
        - cross-python_${{ target_platform }}
    - capnproto
    - if: osx
      then: llvm-openmp
  host:
    - python
    - pip
    - numpy
    - pyyaml
    - setuptools
    - libtorch *cpu*
    - libtorch
    - libmetatomic-torch >=0.1.7,<0.2
    - libmetatensor
    - libmetatensor-torch >=0.8,<0.9
    - xtb
    - eigen >=3.4,<3.5
    # Prebuilt C-API from conda-forge (see readcon-core-feedstock); no vendor tarball.
    - libreadcon-core >=0.13
    - if: win
      then:
        - libblas * *mkl
        - libcblas * *mkl
        - liblapack * *mkl
        - liblapacke * *mkl
    - if: not win
      then:
        - libblas
        - libcblas
        - liblapack
        - liblapacke
    - quill
    - capnproto
    - if: osx
      then: llvm-openmp
  run:
    - python
    - pyyaml
    - numpy
    - xtb
    - quill
    - capnproto
    - libmetatomic-torch >=0.1.7,<0.2
    - libmetatensor-torch
    - libreadcon-core >=0.13
    - if: osx
      then: llvm-openmp

tests:
  - if: (build_platform == target_platform)
    then:
      script:
        - python -c "import eon"
      requirements:
        run:
          - libtorch *cpu*
  - if: (build_platform == target_platform)
    then:
      script:
        - eonclient -h
        - eonclient --version
        - python -c "import eon; import sys; print('eon ok', sys.platform)"
      requirements:
        run:
          - libtorch *cpu*

about:
  homepage: https://eondocs.org/
  license: BSD-3-Clause
  license_file:
    - LICENSE
  summary: "Algorithms for long time scales and potential energy surface exploration"
  description: |
    The EON software package contains algorithms used primarily to model the
    evolution of atomic scale systems over long time scales. This version is
    built with metatomic, xtb, and serve mode support. readcon-core is linked
    from the libreadcon-core conda package (not vendored in this feedstock).
  documentation: https://eondocs.org/index.html
  repository: https://github.com/TheochemUI/eOn

extra:
  recipe-maintainers:
    - HaoZeke
